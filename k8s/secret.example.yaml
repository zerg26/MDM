# Copy to secret.yaml, fill in real values, and apply with:
#   kubectl apply -f k8s/secret.yaml
# (secret.yaml is git-ignored; never commit real keys.)
apiVersion: v1
kind: Secret
metadata:
  name: mdm-api-keys
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  SERPAPI_API_KEY: ""
  TAVILY_API_KEY: ""
  TAVILY_URL: ""
  GOOGLE_API_KEY: ""
  REGISTRY_URL: ""
  REGISTRY_BOOST: "0.5"
